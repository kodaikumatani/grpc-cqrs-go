name: build

# GitHub Release を publish したときだけ GHCR(ghcr.io) にイメージを push する。
# (main への毎 push では build しない。リリース = タグ基点でイメージを固定)
# homelab(RPi5 = arm64)向けに linux/arm64 をビルド。
# app 本体と migrate(atlas + migrations 同梱)の 2 イメージを同一タグで push する。
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write # GHCR への push に必要

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            dockerfile: Dockerfile
          - image: ghcr.io/${{ github.repository }}-migrate
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      # arm64 をエミュレートでビルドするため QEMU を用意
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          # release の tag(vX.Y.Z)から :X.Y.Z / :X.Y と :latest を付与
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
