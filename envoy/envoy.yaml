# Envoy をアプリの前段(sidecar/ゲートウェイ)に置き、JWT を検証して
# 検証済み payload を X-Endpoint-API-UserInfo ヘッダに載せて backend(app) へ渡す。
# ESP(Cloud Endpoints) の代替 — GCP 非依存 / arm64 対応。
#
#   client ─(authorization: Bearer <JWT>)─▶ Envoy :8080
#          ─(x-endpoint-api-userinfo: base64url(payload))─▶ app 127.0.0.1:50051
#
# app 側は無改修: gateway.Parse が forward_payload_header の値(base64url(JSON))を読む。
#
# 要置換: <ISSUER> / <AUDIENCE> / <JWKS_URI> / <JWKS_HOST>
# ⚠️ IdP は JWKS(JSON Web Key Set) を公開している必要がある。Firebase の securetoken は
#    x509(PEM) 形式で JWKS 非対応 → Envoy の remote_jwks では直接使えない。
#    JWKS を公開する IdP(Auth0/Keycloak/Cloudflare Access/Google Sign-In 等)を使うこと。
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        # Pod の唯一の入口。Service はこのポートだけを晒す。
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: app
                            timeout: 0s # gRPC ストリーミング対応
                http_filters:
                  # ⚠️ 必須。app は x-endpoint-api-userinfo を無条件に信頼するので、
                  # クライアントが自分で送ってきた同名ヘッダを **最初に落とす**。
                  # これが無いと、Envoy 経由でもヘッダを偽造するだけで任意ユーザーに
                  # なりすませる (到達経路を Envoy だけに絞っても防げない)。
                  # jwt_authn が後段で検証済みの値を改めて付ける。
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-endpoint-api-userinfo
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        oidc:
                          issuer: "<ISSUER>"
                          audiences: ["<AUDIENCE>"]
                          # 検証済み payload を base64url(JSON) でこのヘッダに載せる
                          # = ESP の X-Endpoint-API-UserInfo 互換。
                          forward_payload_header: x-endpoint-api-userinfo
                          # authorization ヘッダは backend に流さない(不要 & 漏洩防止)
                          forward: false
                          remote_jwks:
                            http_uri:
                              uri: "<JWKS_URI>"
                              cluster: jwks
                              timeout: 5s
                            cache_duration: { seconds: 600 }
                      rules:
                        # health のみ無認証で通す(kubelet / LB の probe 用)。
                        - match: { prefix: "/grpc.health." }
                        # ⚠️ reflection を無認証で開けないこと。外部公開経路では
                        # 全 service/method を匿名で列挙されるため、catch-all 側に
                        # 入れて JWT 必須にする。開発中に列挙したいなら、ローカルで
                        # app を直接叩く (Envoy を挟まない) のが安全。
                        - match: { prefix: "/" }
                          requires: { provider_name: oidc }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # backend = 同一 Pod の app(loopback)。gRPC なので HTTP/2 で接続。
    - name: app
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      # app の grpc.health.v1.Health を叩き、serving 状態を検知する。
      # TCP チェックだと app がハング/DB 断でも「接続可」で healthy に見えるため grpc を使う。
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check: {}
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 50051 }
    # JWKS 取得先(TLS)。<JWKS_HOST> は JWKS_URI のホスト名。
    - name: jwks
      type: STRICT_DNS
      # ⚠️ 既定の AUTO は「AAAA が 1 件でも返れば A を引かない」。IPv6 egress の無い
      # k8s クラスタ (よくある) では、到達不能な IPv6 だけを掴んで JWKS 取得が失敗し、
      # 有効なトークンでも "Jwks remote fetch is failed" になる。DNS 解決自体は成功し
      # endpoint も healthy 扱いになるうえ、log_level: info では何もログに出ないため
      # 極めて気づきにくい。IPv6 egress がある環境なら V4_PREFERRED でもよい。
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: <JWKS_HOST>, port_value: 443 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: <JWKS_HOST>
          # ⚠️ validation_context を省くと Envoy は上流の証明書を検証しない。
          # JWKS は署名鍵の入手経路なので、差し替えられればトークン偽造が通る。
          # CA バンドルのパスは envoy イメージに合わせること
          # (envoyproxy/envoy:distroless-* は /etc/ssl/certs/ca-certificates.crt)。
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: "<JWKS_HOST>" }
