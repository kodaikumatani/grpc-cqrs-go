# ESPv2 (Cloud Endpoints) gRPC サービス設定
# ⚠️ scaffold: <PROJECT_ID> を実プロジェクトに置換し、proto descriptor と一緒に
#    `gcloud endpoints services deploy api_descriptor.pb api_config.yaml` でデプロイする。
type: google.api.Service
config_version: 3

# name は <service>.endpoints.<PROJECT_ID>.cloud.goog 形式
name: grpc-cqrs-go.endpoints.<PROJECT_ID>.cloud.goog
title: grpc-cqrs-go gRPC API

apis:
  - name: recipe.RecipeService
  - name: user.UserService
  - name: share.ShareService

# Firebase Authentication の ID トークンを検証
authentication:
  providers:
    - id: firebase
      issuer: https://securetoken.google.com/<PROJECT_ID>
      jwks_uri: https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com
      audiences: "<PROJECT_ID>"
  rules:
    # 全メソッド認証必須（検証は ESPv2 が実施し、UID を X-Endpoint-API-UserInfo で backend へ）
    - selector: recipe.RecipeService.*
      requirements:
        - provider_id: firebase
    - selector: user.UserService.*
      requirements:
        - provider_id: firebase
    - selector: share.ShareService.*
      requirements:
        - provider_id: firebase
    # 備考: public レシピを未認証で GetRecipe させたい場合はここに
    #   allow_without_credential: true のルールを追加し、app 側も UID 無しを許容する

usage:
  rules:
    - selector: recipe.RecipeService.*
      allow_unregistered_calls: true
    - selector: user.UserService.*
      allow_unregistered_calls: true
    - selector: share.ShareService.*
      allow_unregistered_calls: true
